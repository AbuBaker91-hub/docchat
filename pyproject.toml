[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "docchat"
version = "0.1.0"
description = "RAG document assistant with verified citations, honest not-found, and an eval harness"
requires-python = ">=3.12"
dependencies = [
    "aiforge-core @ git+https://github.com/AbuBaker91-hub/aiforge-core@v0.1.0",
    "pypdf>=4.0",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "httpx>=0.27",
    "fpdf2>=2.7",
]
demo = [
    "aiforge-core[embeddings] @ git+https://github.com/AbuBaker91-hub/aiforge-core@v0.1.0",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
